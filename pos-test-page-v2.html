<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野烏金 POS 系統</title>
    <!-- 引入 Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- 左側：購物車與結帳區 (佔 40%) -->
        <div class="w-2/5 bg-white border-r border-gray-200 flex flex-col justify-between p-4 shadow-md">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">🐟 野烏金 POS</h1>
                <p class="text-sm text-gray-500 mb-4">目前結帳清單</p>
                
                <!-- 購物車清單區 -->
                <div id="cart-items" class="overflow-y-auto max-h-[55vh] space-y-3 pr-1">
                    <p class="text-gray-400 text-center py-10">尚無點選商品</p>
                </div>
            </div>

            <!-- 結帳總金額與按鈕 -->
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-bold text-gray-700">總計金額：</span>
                    <span id="total-price" class="text-2xl font-extrabold text-red-600">NT$ 0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-lg shadow transition">
                    確認結帳
                </button>
            </div>
        </div>

        <!-- 右側：商品圖文按鈕區 (佔 60%) -->
        <div class="w-3/5 flex flex-col p-4 bg-gray-50 overflow-hidden">
            
            <!-- 分類標籤列 -->
            <div id="category-tabs" class="flex gap-2 mb-4 overflow-x-auto pb-2">
                <button onclick="filterCategory('all')" class="category-btn px-4 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-sm whitespace-nowrap">全部商品</button>
                <button onclick="filterCategory('烏魚子')" class="category-btn px-4 py-2 bg-white text-gray-700 border border-gray-300 font-medium rounded-lg shadow-sm whitespace-nowrap">烏魚子系列</button>
                <button onclick="filterCategory('禮盒')" class="category-btn px-4 py-2 bg-white text-gray-700 border border-gray-300 font-medium rounded-lg shadow-sm whitespace-nowrap">精美禮盒</button>
                <button onclick="filterCategory('手作')" class="category-btn px-4 py-2 bg-white text-gray-700 border border-gray-300 font-medium rounded-lg shadow-sm whitespace-nowrap">手作料理</button>
            </div>

            <!-- 商品圖文網格 -->
            <div id="product-grid" class="grid grid-cols-3 gap-4 overflow-y-auto p-1">
                <!-- 商品會透過 JavaScript 自動渲染進來 -->
            </div>
        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 模擬商品資料庫（可替換成您的真實商品與圖片網址）
        const products = [
            { id: 1, name: "野生烏魚子切片", price: 500, category: "烏魚子", image: "https://via.placeholder.com/150" },
            { id: 2, name: "頂級一口烏魚子", price: 350, category: "烏魚子", image: "https://via.placeholder.com/150" },
            { id: 3, name: "過年豪華禮盒", price: 1200, category: "禮盒", image: "https://via.placeholder.com/150" },
            { id: 4, name: "烏魚子炒飯", price: 180, category: "手作", image: "https://via.placeholder.com/150" },
            { id: 5, name: "手作XO醬", price: 280, category: "手作", image: "https://via.placeholder.com/150" }
        ];

        let cart = []; // 購物車陣列

        // 初始化載入全部商品
        window.onload = function() {
            renderProducts(products);
        };

        // 渲染商品按鈕網格
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-md hover:border-blue-400 transition flex flex-col justify-between';
                card.onclick = () => addToCart(product);
                
                card.innerHTML = `
                    <div class="h-28 bg-gray-200 flex items-center justify-center">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3 text-center">
                        <h3 class="font-bold text-gray-800 text-sm truncate">${product.name}</h3>
                        <p class="text-blue-600 font-bold mt-1">NT$ ${product.price}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 分類篩選
        function filterCategory(category) {
            if (category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        // 加入購物車
        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // 變更數量
        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        // 更新購物車畫面
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-center py-10">尚無點選商品</p>';
                totalPriceElement.innerText = 'NT$ 0';
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemRow = document.createElement('div');
                itemRow.className = 'flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100';
                itemRow.innerHTML = `
                    <div class="flex-1">
                        <h4 class="text-sm font-bold text-gray-800">${item.name}</h4>
                        <span class="text-xs text-gray-500">NT$ ${item.price} x ${item.quantity}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 bg-gray-200 rounded-md font-bold text-gray-600 hover:bg-gray-300">-</button>
                        <span class="text-sm font-bold w-5 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 bg-gray-200 rounded-md font-bold text-gray-600 hover:bg-gray-300">+</button>
                    </div>
                `;
                cartContainer.appendChild(itemRow);
            });

            totalPriceElement.innerText = `NT$ ${total}`;
        }

        // 結帳動作
        function checkout() {
            if (cart.length === 0) {
                alert('目前購物車是空的！');
                return;
            }
            alert('結帳成功！總金額：' + document.getElementById('total-price').innerText);
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
