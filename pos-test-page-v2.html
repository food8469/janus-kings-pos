<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>野烏金 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 解決 iPad 瀏覽器 h-screen / 100vh 被網址列遮擋的問題 */
        .app-height {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans app-height w-screen overflow-hidden flex flex-col">

    <!-- 💡 頂部狀態欄：門市與值班人員選擇 -->
    <header class="bg-indigo-900 text-white px-3 py-1.5 flex justify-between items-center shadow-md flex-none">
        <div class="flex items-center gap-2">
            <span class="text-sm sm:text-base font-bold">🐟 野烏金 POS 系統</span>
        </div>
        <div class="flex items-center gap-2 text-xs">
            <div class="flex items-center gap-1">
                <label class="font-bold text-indigo-200">門市：</label>
                <select id="store-select" class="bg-indigo-800 text-white font-bold rounded px-1.5 py-0.5 outline-none border border-indigo-700">
                    <option value="高雄總部">高雄總部</option>
                    <option value="台中門市">台中門市</option>
                </select>
            </div>
            <div class="flex items-center gap-1">
                <label class="font-bold text-indigo-200">人員：</label>
                <select id="staff-select" class="bg-indigo-800 text-white font-bold rounded px-1.5 py-0.5 outline-none border border-indigo-700">
                    <option value="店長">店長</option>
                    <option value="人員A">人員 A</option>
                    <option value="人員B">人員 B</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 (左購物車 40% + 右商品 60%) -->
    <div class="flex flex-1 overflow-hidden min-h-0">
        
        <!-- 左側：購物車區 (40%) -->
        <div class="w-2/5 bg-white border-r border-gray-200 flex flex-col p-2.5 shadow-md h-full overflow-hidden">
            
            <!-- 上半部：購物車標題 -->
            <div class="flex justify-between items-center pb-1 border-b border-gray-100 flex-none">
                <h2 class="text-xs font-bold text-gray-700">目前點選清單</h2>
                <button onclick="clearCart()" class="text-xs text-red-500 font-bold hover:underline">清空</button>
            </div>

            <!-- 🛒 購物車商品清單 (設為 min-h-0 讓中間空白彈性縮小，確保底部不被推出螢幕) -->
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-1.5 py-1.5 pr-1 min-h-0">
                <p class="text-gray-400 text-center py-4 text-xs">尚無點選商品，請由右側點選</p>
            </div>

            <!-- 🔒 核心修正：固定在底部的結帳區域 -->
            <div class="border-t border-gray-200 pt-1.5 flex-none space-y-1 bg-white">
                
                <!-- 折扣設定列 -->
                <div class="bg-gray-50 p-1.5 rounded-lg border border-gray-200 flex items-center justify-between gap-1">
                    <span class="text-xs font-bold text-gray-600 flex-none">折扣：</span>
                    <select id="discount-select" onchange="updateCartUI()" class="text-xs border border-gray-300 rounded p-1 font-bold text-gray-700 bg-white flex-1 outline-none">
                        <option value="none">原價 (無折扣)</option>
                        <option value="0.95">95 折</option>
                        <option value="0.9">9 折</option>
                        <option value="0.85">85 折</option>
                        <option value="custom-minus">手動折抵金額</option>
                    </select>
                    <input id="custom-discount-amount" type="number" placeholder="金額" oninput="updateCartUI()" class="hidden w-16 text-xs border border-gray-300 rounded p-1 font-bold text-red-600 outline-none">
                </div>

                <!-- 金額統計明細 -->
                <div class="space-y-0.5 text-xs py-0.5">
                    <div class="flex justify-between items-center text-gray-500">
                        <span>商品小計：</span>
                        <span id="subtotal-price">NT$ 0</span>
                    </div>
                    <div id="discount-row" class="flex justify-between items-center text-green-600 hidden">
                        <span>折扣折抵：</span>
                        <span id="discount-amount">- NT$ 0</span>
                    </div>
                    <div class="flex justify-between items-center pt-0.5 border-t border-gray-100">
                        <span class="font-bold text-gray-800 text-xs">應付總額：</span>
                        <span id="total-price" class="text-lg font-extrabold text-red-600">NT$ 0</span>
                    </div>
                </div>

                <!-- 🎯 提交銷售單按鈕 -->
                <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-2 rounded-xl text-sm shadow transition">
    確認結帳
</button>
            </div>
        </div>

        <!-- 右側：商品卡片網格 (60%) -->
        <div class="w-3/5 flex flex-col p-2.5 bg-gray-50 h-full overflow-hidden">
            <div id="product-grid" class="grid grid-cols-3 gap-2 overflow-y-auto p-0.5 h-full content-start items-start">
            </div>
        </div>
    </div>

    <!-- 💡 規格與口味選擇彈窗 (Modal) -->
    <div id="option-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <h3 id="modal-product-name" class="text-base font-bold text-gray-800 border-b pb-2">選擇商品規格</h3>
            
            <div id="modal-content" class="space-y-3"></div>

            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-300">取消</button>
                <button id="modal-confirm-btn" onclick="confirmSpecAddToCart()" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 hidden">確定加入</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 商品資料庫
        const products = [
            { 
                id: 1, 
                name: "經典一口吃", 
                image: "大圓.jpg",
                options: [
                    { name: "鹽味", price: 1280 },
                    { name: "紅酒", price: 1280 },
                    { name: "味噌", price: 1380 },
                    { name: "香辣", price: 1380 },
                    { name: "花雕", price: 1380 }
                ]
            }, 
            { 
                id: 2, 
                name: "特殊口味一口吃", 
                image: "大圓.jpg",
                options: [
                    { name: "竹鹽", price: 1580 },
                    { name: "玫瑰紅酒", price: 1580 },
                    { name: "黑松露", price: 1980 },
                    { name: "瑤柱干貝", price: 1980 },
                    { name: "哇沙米", price: 1980 }
                ]
            }, 
            {
                id: 3, 
                name: "經典碳烤烏魚子", 
                image: "大方1.jpg",
                specs: [
                    {
                        specName: "5兩",
                        flavors: [
                            { name: "鹽味", price: 1380 },
                            { name: "紅酒", price: 1380 },
                            { name: "味噌", price: 1480 },
                            { name: "香辣", price: 1480 },
                            { name: "花雕", price: 1480 }
                        ]
                    },
                    {
                        specName: "6兩",
                        flavors: [
                            { name: "鹽味", price: 1580 },
                            { name: "紅酒", price: 1580 },
                            { name: "味噌", price: 1680 },
                            { name: "香辣", price: 1680 },
                            { name: "花雕", price: 1680 }
                        ]
                    },
                    {
                        specName: "7兩",
                        flavors: [
                            { name: "鹽味", price: 1980 },
                            { name: "紅酒", price: 1980 },
                            { name: "味噌", price: 2080 },
                            { name: "香辣", price: 2080 },
                            { name: "花雕", price: 2080 }
                        ]
                    },
                    {
                        specName: "8兩",
                        flavors: [
                            { name: "鹽味", price: 3280 },
                            { name: "紅酒", price: 3280 },
                            { name: "味噌", price: 3380 },
                            { name: "香辣", price: 3380 },
                            { name: "花雕", price: 3380 }
                        ]
                    },
                    {
                        specName: "9兩",
                        flavors: [
                            { name: "鹽味", price: 3480 },
                            { name: "紅酒", price: 3480 },
                            { name: "味噌", price: 3580 },

                            { name: "花雕", price: 3580 }
                        ]
                    },
                    {
                        specName: "10兩",
                        flavors: [
                            { name: "鹽味", price: 4280 },
                            { name: "紅酒", price: 4280 },
                            { name: "味噌", price: 4380 },

                        ]
                    },
                    {
                        specName: "11兩",
                        flavors: [
                            { name: "鹽味", price: 4980 },
                            { name: "紅酒", price: 4980 },
                            { name: "味噌", price: 5080 },
                            { name: "香辣", price: 5080 },
                            { name: "花雕", price: 5080 }
                        ]
                    }
                ]
            },
            { 
                id: 4,
                name: "特殊口味碳烤烏魚子",
                image: "大方1.jpg",
                specs: [
                    {
                        specName: "5兩",
                        flavors: [
                            { name: "竹鹽", price: 1680 },
                            { name: "玫瑰紅酒", price: 1680 },
                            { name: "黑松露", price: 2080 },
                            { name: "瑤柱干貝", price: 2080 },
                            { name: "哇沙米", price: 2080 }
                        ]
                    },
                    {
                        specName: "6兩",
                        flavors: [
                            { name: "竹鹽", price: 1880 },
                            { name: "玫瑰紅酒", price: 1880 },
                            { name: "黑松露", price: 2280 },
                            { name: "瑤柱干貝", price: 2280 },
                            { name: "哇沙米", price: 2280 }
                        ]
                    },
                    {
                        specName: "7兩",
                        flavors: [
                            { name: "竹鹽", price: 2280 },
                            { name: "玫瑰紅酒", price: 2280 },
                            { name: "黑松露", price: 2680 },
                            { name: "瑤柱干貝", price: 2680 },
                            { name: "哇沙米", price: 2680 }
                        ]
                    },
                    {
                        specName: "8兩",
                        flavors: [
                            { name: "竹鹽", price: 3580 },
                            { name: "玫瑰紅酒", price: 3580 },
                            { name: "黑松露", price: 3980 },
                            { name: "瑤柱干貝", price: 3980 },
                            { name: "哇沙米", price: 3980 }
                        ]
                    },
                    {
                        specName: "9兩",
                        flavors: [
                            { name: "竹鹽", price: 3780 },
                            { name: "玫瑰紅酒", price: 3780 },
                            { name: "黑松露", price: 4180 },
                            { name: "瑤柱干貝", price: 4180 },
                            { name: "哇沙米", price: 4180 }
                        ]
                    },
                    {
                        specName: "10兩",
                        flavors: [
                            { name: "竹鹽", price: 4580 },
                            { name: "玫瑰紅酒", price: 4580 },
                            { name: "黑松露", price: 4980 },
                            { name: "瑤柱干貝", price: 4980 },
                            { name: "哇沙米", price: 4980 }
                        ]
                    },
                    {
                        specName: "11兩",
                        flavors: [
                            { name: "竹鹽", price: 5280 },
                            { name: "玫瑰紅酒", price: 5280 },
                            { name: "黑松露", price: 5680 },
                            { name: "瑤柱干貝", price: 5680 },
                            { name: "哇沙米", price: 5680 }
                        ]
                    }
                ]
            },
            { id: 5, name: "雙園禮盒", price: 180, category: "手作", image: "雙園禮盒.jpg" },
            { id: 6, name: "烏魚子牛奶糖", price: 280, category: "手作", image: "烏金牛奶糖.jpg" }
        ];

        let cart = []; 
        let currentProduct = null;
        let selectedSpec = null;
        let selectedFlavorObj = null;

        window.onload = function() {
            renderProducts();
        };

        // 渲染商品網格
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-md transition flex flex-col active:scale-95 duration-150 h-fit';
                card.onclick = () => handleProductClick(product);
                
                let displayPrice = "";
                if (product.options) {
                    displayPrice = `NT$ ${product.options[0].price} 起`;
                } else if (product.specs) {
                    displayPrice = `NT$ ${product.specs[0].flavors[0].price} 起`;
                } else {
                    displayPrice = `NT$ ${product.price}`;
                }

                // 💡 調整重點：
                // 1. 圖片比例改為 aspect-[16/10]，讓圖片區稍扁一點，釋放出更多垂直空間給文字。
                // 2. 文字容器改為 p-3 徹底移除固定高度限制，設定 leading-normal 與 py-2，讓字體就算寫兩列也有充裕空間，絕不被切下半截！
                card.innerHTML = `
                    <div class="w-full aspect-[16/10] bg-amber-50 flex items-center justify-center overflow-hidden relative">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover" 
                             onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
                        <div class="hidden absolute inset-0 flex items-center justify-center bg-amber-100/60 p-2 text-center">
                            <span class="text-amber-900 font-bold text-xs">${product.name}</span>
                        </div>
                    </div>
                    <div class="p-3 text-center bg-white border-t border-gray-100 flex flex-col justify-center items-center">
                        <h3 class="font-bold text-gray-800 text-xs sm:text-sm leading-normal">${product.name}</h3>
                        <p class="text-indigo-600 font-extrabold text-xs mt-1.5">${displayPrice}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 點擊商品處理邏輯
        function handleProductClick(product) {
            currentProduct = product;
            selectedSpec = null;
            selectedFlavorObj = null;

            if (product.specs) {
                openSpecModal(product);
            } else if (product.options) {
                openOptionModal(product);
            } else {
                addToCart(product.name, product.price);
            }
        }

        // 開啟單層選項彈窗
        function openOptionModal(product) {
            document.getElementById('modal-product-name').innerText = `選擇【${product.name}】口味`;
            document.getElementById('modal-confirm-btn').classList.add('hidden');
            
            const container = document.getElementById('modal-content');
            container.innerHTML = '<div id="modal-options" class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto p-1"></div>';
            
            const optionsBox = document.getElementById('modal-options');
            product.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'p-3 border-2 border-indigo-100 bg-indigo-50/50 hover:bg-indigo-600 hover:text-white rounded-xl text-left transition font-bold text-sm flex flex-col justify-between';
                btn.onclick = () => {
                    addToCart(`${product.name} (${opt.name})`, opt.price);
                    closeModal();
                };
                btn.innerHTML = `
                    <span class="block">${opt.name}</span>
                    <span class="block text-indigo-500 font-extrabold mt-1 hover:text-white">NT$ ${opt.price}</span>
                `;
                optionsBox.appendChild(btn);
            });

            showModal();
        }

        // 開啟兩數 + 口味彈窗
        function openSpecModal(product) {
            document.getElementById('modal-product-name').innerText = `選擇【${product.name}】規格與口味`;
            const container = document.getElementById('modal-content');
            
            container.innerHTML = `
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">1. 選擇兩數</label>
                    <div id="spec-box" class="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto p-1 border border-gray-100 rounded-lg"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">2. 選擇口味</label>
                    <div id="flavor-box" class="grid grid-cols-2 gap-2 text-xs text-gray-400 py-2 max-h-48 overflow-y-auto p-1">請先選擇兩數</div>
                </div>
            `;

            const specBox = document.getElementById('spec-box');
            product.specs.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'spec-btn p-2 border border-gray-300 rounded-lg text-xs font-bold text-gray-700 hover:border-indigo-500';
                btn.innerText = s.specName;
                btn.onclick = () => selectSpec(s, btn);
                specBox.appendChild(btn);
            });

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.classList.remove('hidden');
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');

            showModal();
        }

        // 選擇兩數
        function selectSpec(specObj, element) {
            selectedSpec = specObj;
            selectedFlavorObj = null;

            document.querySelectorAll('.spec-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                b.classList.add('text-gray-700', 'border-gray-300');
            });
            element.classList.remove('text-gray-700', 'border-gray-300');
            element.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');

            const flavorBox = document.getElementById('flavor-box');
            flavorBox.innerHTML = '';

            specObj.flavors.forEach(f => {
                const btn = document.createElement('button');
                btn.className = 'flavor-btn p-2 border border-gray-300 rounded-lg text-left hover:border-indigo-500 flex justify-between items-center';
                btn.onclick = () => selectFlavor(f, btn);
                btn.innerHTML = `
                    <span class="text-xs font-bold text-gray-800">${f.name}</span>
                    <span class="text-xs text-indigo-600 font-extrabold">NT$ ${f.price}</span>
                `;
                flavorBox.appendChild(btn);
            });

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // 選擇口味
        function selectFlavor(flavorObj, element) {
            selectedFlavorObj = flavorObj;

            document.querySelectorAll('.flavor-btn').forEach(b => {
                b.classList.remove('border-indigo-600', 'bg-indigo-50');
            });
            element.classList.add('border-indigo-600', 'bg-indigo-50');

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.disabled = false;
            confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // 確認選取加入購物車
        function confirmSpecAddToCart() {
            if (!selectedSpec || !selectedFlavorObj) return;
            const fullName = `${currentProduct.name}-${selectedSpec.specName} (${selectedFlavorObj.name})`;
            addToCart(fullName, selectedFlavorObj.price);
            closeModal();
        }

        function showModal() {
            document.getElementById('option-modal').classList.remove('hidden');
            document.getElementById('option-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('option-modal').classList.add('hidden');
            document.getElementById('option-modal').classList.remove('flex');
        }

        // 加入購物車
        function addToCart(fullName, price) {
            const existingItem = cart.find(item => item.name === fullName);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: fullName, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        // 變更數量
        function changeQuantity(name, delta) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
            }
            updateCartUI();
        }

        // 更新購物車 UI
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-center py-10">尚無點選商品，請由右側點選</p>';
                totalPriceElement.innerText = 'NT$ 0';
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemRow = document.createElement('div');
                itemRow.className = 'flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-200';
                itemRow.innerHTML = `
                    <div class="flex-1 pr-2">
                        <h4 class="text-xs font-bold text-gray-800">${item.name}</h4>
                        <span class="text-xs text-gray-500">NT$ ${item.price}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="changeQuantity('${item.name}', -1)" class="w-6 h-6 bg-white border border-gray-300 rounded font-bold hover:bg-gray-100">-</button>
                        <span class="text-xs font-bold w-6 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity('${item.name}', 1)" class="w-6 h-6 bg-white border border-gray-300 rounded font-bold hover:bg-gray-100">+</button>
                    </div>
                `;
                cartContainer.appendChild(itemRow);
            });

            totalPriceElement.innerText = `NT$ ${total}`;
        }

        function checkout() {
            if (cart.length === 0) return alert('目前購物車是空的！');
            alert('結帳成功！總金額：' + document.getElementById('total-price').innerText);
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
