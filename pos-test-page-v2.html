<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野烏金 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans h-screen overflow-hidden">

    <div class="flex h-full">
        <!-- 左側：購物車區 (40%) -->
        <div class="w-2/5 bg-white border-r border-gray-200 flex flex-col justify-between p-4 shadow-md h-full">
            <div class="flex flex-col h-full overflow-hidden">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">🐟 野烏金 POS</h1>
                <p class="text-sm font-bold text-gray-700 mb-2">目前點選清單</p>

                <!-- 購物車清單 -->
                <div id="cart-items" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2">
                    <p class="text-gray-400 text-center py-10">尚無點選商品，請由右側點選</p>
                </div>
            </div>

            <!-- 結帳總金額與按鈕 -->
            <div class="border-t pt-3 mt-auto">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-lg font-bold text-gray-700">總計金額：</span>
                    <span id="total-price" class="text-2xl font-extrabold text-red-600">NT$ 0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-lg shadow transition">
                    提交銷售單
                </button>
            </div>
        </div>

        <!-- 右側：商品卡片網格 (60%) -->
        <div class="w-3/5 flex flex-col p-4 bg-gray-50 h-full overflow-hidden">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 overflow-y-auto p-1 flex-1">
                <!-- 商品自動渲染區 -->
            </div>
        </div>
    </div>

    <!-- 💡 規格選擇彈窗 (Modal) -->
    <div id="option-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <h3 id="modal-product-name" class="text-lg font-bold text-gray-800">選擇商品規格</h3>
            
            <!-- 選項按鈕區 -->
            <div id="modal-options" class="grid grid-cols-2 gap-2">
                <!-- 規格動態加入 -->
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-bold hover:bg-gray-300">取消</button>
            </div>
        </div>
    </div>
    
 
    <!-- JavaScript 邏輯 -->
    <script>
        // 模擬商品資料庫（可替換成您的真實商品與圖片網址）
        const products = [
            { 
                id: 1, 
                name: "經典一口吃", 
                image: "https://raw.githubusercontent.com/food8469/janus-kings-pos/6a1c006b61c52e81e5f830d2b05eadc49de96253/%E5%A4%A7%E5%9C%93.jpg",
                // 設有 options 規格選單
                options: [
                    { name: "鹽味", price: 1280 },
                    { name: "紅酒", price: 1280 },
                    { name: "味噌", price: 1380 },
                    { name: "香辣", price: 1380 },
                    { name: "花雕", price: 1380 }
                ]
            } 
            { id: 2, name: "特殊口味一口吃", price: 1580, category: "烏魚子", image: "https://raw.githubusercontent.com/food8469/janus-kings-pos/6a1c006b61c52e81e5f830d2b05eadc49de96253/%E5%A4%A7%E5%9C%93.jpg" },
            { id: 3, name: "經典碳烤烏魚子", price: 1380, category: "禮盒", image: "https://raw.githubusercontent.com/food8469/janus-kings-pos/6016b5b02748f3fa011711f76bd9aba4bae51700/%E5%A4%A7%E6%96%B91.jpg" },
            { id: 4, name: "特殊口味碳烤烏魚子", price: 1680, category: "手作", image: "https://raw.githubusercontent.com/food8469/janus-kings-pos/6016b5b02748f3fa011711f76bd9aba4bae51700/%E5%A4%A7%E6%96%B91.jpg" },
            { id: 5, name: "雙園禮盒", price: 180, category: "手作", image: "https://via.placeholder.com/150" },
            { id: 6, name: "烏魚子牛奶糖", price: 280, category: "手作", image: "https://via.placeholder.com/150" }
        ];

        let cart = []; // 購物車陣列

        // 初始化載入全部商品
        window.onload = function() {
            renderProducts(products);
        };

        // 渲染商品按鈕網格
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-md hover:border-blue-400 transition flex flex-col justify-between';
                card.onclick = () => addToCart(product);
                
                card.innerHTML = `
                    <div class="h-28 bg-gray-200 flex items-center justify-center">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3 text-center">
                        <h3 class="font-bold text-gray-800 text-sm truncate">${product.name}</h3>
                        <p class="text-blue-600 font-bold mt-1">NT$ ${product.price}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 分類篩選
        function filterCategory(category) {
            if (category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        // 加入購物車
        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // 變更數量
        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        // 更新購物車畫面
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-center py-10">尚無點選商品</p>';
                totalPriceElement.innerText = 'NT$ 0';
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemRow = document.createElement('div');
                itemRow.className = 'flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100';
                itemRow.innerHTML = `
                    <div class="flex-1">
                        <h4 class="text-sm font-bold text-gray-800">${item.name}</h4>
                        <span class="text-xs text-gray-500">NT$ ${item.price} x ${item.quantity}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 bg-gray-200 rounded-md font-bold text-gray-600 hover:bg-gray-300">-</button>
                        <span class="text-sm font-bold w-5 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 bg-gray-200 rounded-md font-bold text-gray-600 hover:bg-gray-300">+</button>
                    </div>
                `;
                cartContainer.appendChild(itemRow);
            });

            totalPriceElement.innerText = `NT$ ${total}`;
        }

        // 結帳動作
        function checkout() {
            if (cart.length === 0) {
                alert('目前購物車是空的！');
                return;
            }
            alert('結帳成功！總金額：' + document.getElementById('total-price').innerText);
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
