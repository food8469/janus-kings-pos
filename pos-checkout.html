<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野烏金 POS - 前台結帳</title>
    <!-- 加到主畫面成為 App -->
    <link rel="manifest" href="/manifest-pos.webmanifest">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="/icon-pos-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="野烏金收銀">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f5f5f5; }
        .container { display: flex; min-height: 100vh; }
        .left { flex: 2; background: white; padding: 20px; overflow-y: auto; }
        .right { flex: 1; background: #f9f9f9; padding: 20px; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-content { flex: 1; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .menu-btn { background: none; border: none; color: white; font-size: 48px; cursor: pointer; padding: 20px; line-height: 1; transition: all 0.3s; }
        .menu-btn:hover { transform: scale(1.1); }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .series-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px; padding: 30px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .series-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3); }
        .series-card h3 { font-size: 18px; margin-bottom: 10px; }
        .series-card p { font-size: 12px; opacity: 0.9; }
        .product-card { background: white; border: 2px solid #ddd; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .product-card:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2); }
        .product-card.selected { border-color: #667eea; background: #f0f4ff; }
        .product-name { font-weight: 600; margin: 10px 0 5px; font-size: 14px; }
        .product-price { color: #667eea; font-size: 16px; font-weight: bold; }
        .category-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .category-tab { padding: 12px 24px; background: white; color: #555; border: 2px solid #ddd; border-radius: 24px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; }
        .category-tab.active { background: #667eea; color: white; border-color: #667eea; }
        .product-stock { font-size: 12px; color: #2b8a3e; margin-top: 6px; }
        .product-stock.low { color: #e67700; font-weight: bold; }
        .product-stock.out { color: #e03131; font-weight: bold; }
        .back-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
        .back-btn:hover { background: #5568d3; }
        .cart-item { background: white; padding: 12px; border-radius: 6px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 14px; }
        .cart-item-qty { font-size: 12px; color: #999; }
        .cart-item-total { font-weight: bold; color: #667eea; margin-right: 10px; }
        .remove-btn { background: #ff6b6b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .qty-input { width: 50px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-size: 12px; }
        .summary { background: white; padding: 15px; border-radius: 6px; margin-top: auto; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .summary-row.total { border-bottom: none; font-size: 18px; font-weight: bold; color: #667eea; }
        .checkout-form { margin-top: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #333; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .checkout-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .checkout-btn:hover { opacity: 0.9; }
        .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 10px; border-radius: 4px; margin-top: 10px; font-size: 12px; text-align: center; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }

        @media (max-width: 900px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
            .header { padding: 15px; }
            .header h1 { font-size: 18px; }
        }

        @media (max-width: 600px) {
            .product-grid { grid-template-columns: 1fr; }
        }

        [hidden] { display: none !important; }

        /* ===== 購物車（清單式排版）===== */
        .cart-panel { padding: 0; background: white; }
        .cart-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #eee; }
        .cart-title { flex: 1; text-align: center; font-size: 17px; font-weight: bold; color: #333; }
        .cart-title span { font-weight: normal; color: #888; font-size: 14px; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
        .icon-btn:hover { background: #f1f3f5; }
        .cart-store { font-size: 12px; color: #667eea; background: #eef1ff; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 15px; color: #333; }
        .cart-row.clickable { cursor: pointer; color: #555; }
        .cart-row.clickable:hover { background: #fafafa; }
        .cart-row input, .cart-row select { width: auto; flex: 1; min-width: 0; }
        .row-icon { font-size: 18px; margin-right: 10px; }
        .row-clear { background: none; border: none; color: #999; font-size: 16px; cursor: pointer; padding: 2px 6px; }
        .row-actions { display: flex; align-items: center; gap: 6px; }
        .row-plus { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #667eea; background: white; color: #667eea; font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .row-plus:hover { background: #667eea; color: white; }
        .cust-phone { color: #999; font-size: 13px; margin-left: 8px; }

        /* ===== 付款視窗 ===== */
        .pay-card { max-width: 480px; }
        .pay-total { text-align: center; font-size: 40px; font-weight: bold; color: #333; margin: 4px 0 14px; }
        .pay-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
        .pay-row select, .pay-row input { width: auto; flex: 0 1 220px; text-align: right; padding: 8px; }
        .pay-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .pay-method { display: flex; align-items: center; gap: 12px; padding: 22px 18px; background: white; border: 2px solid #e5e5e5; border-radius: 10px; font-size: 18px; font-weight: bold; color: #333; cursor: pointer; font-family: inherit; }
        .pay-method:hover { border-color: #667eea; background: #f7f8ff; }
        .pay-method:active { transform: scale(0.98); }
        .pay-method:disabled { opacity: 0.5; cursor: wait; }
        .pay-method.selected { border-color: #667eea; background: #eef1ff; box-shadow: 0 0 0 2px #667eea inset; }
        .payment-label { font-weight: bold; color: #333; }
        .payment-label.empty { font-weight: normal; color: #aaa; }
        .payment-label small { font-weight: normal; color: #888; margin-left: 6px; }
        .pay-icon { font-size: 28px; }
        .pay-summary { background: white; border-radius: 8px; margin-top: 8px; }
        .pay-summary:empty { display: none; }
        .pay-summary div { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 14px; border-bottom: 1px solid #f3f3f3; }
        .pay-summary div:last-child { border-bottom: none; }

        /* ===== 顧客小視窗 ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1500; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: white; border-radius: 12px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; padding: 16px 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
        .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .modal-head h3 { flex: 1; font-size: 18px; }
        .menu-back-dark { background: #f1f3f5; border: none; border-radius: 14px; padding: 4px 12px; cursor: pointer; font-family: inherit; }
        .modal-card label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
        .modal-card input { padding: 11px; font-size: 15px; }
        .hint-text { font-size: 12px; color: #999; margin-top: 8px; }
        .cust-results { margin: 10px 0; max-height: 45vh; overflow-y: auto; }
        .cust-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
        .cust-item:hover { border-color: #667eea; background: #f7f8ff; }
        .cust-item small { display: block; color: #999; font-size: 12px; margin-top: 2px; }
        .cust-info { background: #f7f8ff; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.8; }
        .cust-buttons { display: flex; gap: 8px; align-items: center; }
        .cust-buttons .checkout-btn { flex: 1; }
        .cart-items { flex: 1; overflow-y: auto; background: #f7f7f7; padding: 4px 12px; min-height: 120px; }
        .cart-empty { color: #aaa; text-align: center; padding: 40px 0; font-size: 14px; }
        .cart-bottom { border-top: 1px solid #eee; }
        .discount-amt { color: #e03131; font-weight: bold; }
        .discount-edit select { flex: 0 0 auto; width: 90px; }
        .staff-select { max-width: 60%; }
        .small-btn { padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; font-family: inherit; }
        .small-btn.ghost { background: #f1f3f5; color: #555; }
        .checkout-btn.big { margin: 14px 16px 10px; width: calc(100% - 32px); font-size: 18px; padding: 16px; border-radius: 10px; }
        #message { margin: 0 16px 12px; }

        /* ===== 未授權裝置的鎖定畫面 ===== */
        .lock-screen { position: fixed; inset: 0; z-index: 2000; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .lock-card { background: white; border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
        .lock-card h2 { margin: 8px 0; }
        .lock-card p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
        .lock-form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .lock-form input, .lock-form select { padding: 12px; font-size: 15px; }
        .lock-form label { margin-bottom: -4px; }

        /* ===== 漢堡選單側邊面板 ===== */
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; }
        .menu-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: #f9f9f9; display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.2); }
        .menu-head { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        .menu-head h2 { font-size: 20px; }
        .menu-head button { background: none; border: none; color: white; font-size: 26px; cursor: pointer; }
        .menu-head h2 { flex: 1; }
        .menu-head .menu-back { font-size: 16px; margin-right: 10px; padding: 4px 10px; border: 1px solid rgba(255,255,255,0.6); border-radius: 16px; }
        .menu-item { width: 100%; display: flex; align-items: center; gap: 16px; background: white; border: 1px solid #e5e5e5; border-radius: 10px; padding: 18px; margin-bottom: 12px; cursor: pointer; text-align: left; font-family: inherit; }
        .menu-item:hover { border-color: #667eea; background: #f7f8ff; }
        .menu-item b { display: block; font-size: 18px; color: #333; }
        .menu-item small { display: block; font-size: 12px; color: #999; margin-top: 3px; }
        .menu-icon { font-size: 30px; }
        .punch-note { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; resize: vertical; }
        .punch-note-text { font-size: 12px; color: #888; margin-top: 2px; }
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .staff-tile { padding: 14px 8px; background: white; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; font-weight: bold; color: #333; cursor: pointer; font-family: inherit; }
        .staff-tile:hover { border-color: #667eea; }
        .staff-tile.active { background: #667eea; border-color: #667eea; color: white; }
        .punch-pin { margin-top: 10px; font-size: 18px; letter-spacing: 4px; padding: 10px; }
        .device-status { font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
        .device-status.ok { background: #ebfbee; color: #2b8a3e; }
        .device-status.bad { background: #fff4e6; color: #d9480f; }
        .menu-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
        .menu-store { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 14px; }
        .menu-store select { width: auto; flex: 1; }
        .punch-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
        .punch-btn { padding: 16px; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; color: white; cursor: pointer; font-family: inherit; }
        .punch-btn.in { background: #2b8a3e; }
        .punch-btn.out { background: #e67700; }
        .punch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .list-title { font-size: 14px; font-weight: bold; color: #555; margin: 18px 0 8px; }
        .list-row { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: white; }
        .tag.in { background: #2b8a3e; }
        .tag.out { background: #e67700; }
        .order-card { background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
        .order-head { display: flex; justify-content: space-between; color: #888; font-size: 12px; margin-bottom: 6px; }
        .order-line { display: flex; justify-content: space-between; padding: 2px 0; }
        .order-total { border-top: 1px solid #eee; margin-top: 6px; padding-top: 6px; display: flex; justify-content: space-between; font-weight: bold; color: #667eea; }
        .day-summary { background: white; border-radius: 8px; padding: 14px; display: flex; justify-content: space-around; text-align: center; }
        .day-summary b { display: block; font-size: 20px; color: #667eea; }
        .day-summary span { font-size: 12px; color: #999; }
        .empty { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="header">
                <div class="header-content">
                    <h1>🐟 野烏金 POS</h1>
                    <p style="font-size: 12px; margin-top: 10px;">API: <input type="text" id="apiUrl" value="" style="width: 300px; padding: 5px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white;" placeholder="留空 = 使用本站"></p>
                </div>
                <button class="menu-btn" onclick="openMenu()">☰</button>
            </div>

            <!-- 大分類 -->
            <div id="categoryTabs" class="category-tabs"></div>

            <!-- 系列列表視圖 -->
            <div id="seriesView" class="product-grid" style="display: grid;"></div>

            <!-- 品項選擇彈窗 -->
            <div id="itemModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; padding: 20px;">
                <div style="background: white; border-radius: 8px; padding: 20px; max-height: 80vh; overflow-y: auto; margin: auto; width: 90%; max-width: 600px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 id="modalTitle" style="margin: 0;"></h2>
                        <button onclick="closeItemModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">✕</button>
                    </div>
                    <div id="itemsGrid" class="product-grid" style="grid-template-columns: repeat(2, 1fr); gap: 10px;"></div>
                </div>
            </div>
        </div>

        <div class="right cart-panel" id="cartPanel">
            <!-- 標題列：清空購物車 / 購物車件數 / 門市 -->
            <div class="cart-head">
                <button class="icon-btn" onclick="clearCart()" title="清空購物車">🗑</button>
                <div class="cart-title">購物車 <span id="cartCount">(0件)</span></div>
                <span class="cart-store" id="cartStoreLabel"></span>
            </div>
            <!-- 門市由裝置登記決定，不顯示選單 -->
            <select id="store" hidden>
                <option value="高雄">高雄</option>
                <option value="台中">台中</option>
            </select>

            <!-- 顧客 -->
            <div class="cart-row clickable" id="customerRow" onclick="openCustomerModal()">
                <span><span class="row-icon">👤</span><span id="customerLabel">搜尋 / 新增顧客</span></span>
                <span class="row-actions">
                    <button class="row-clear" id="customerClear" hidden title="不指定顧客" onclick="event.stopPropagation(); setCustomer(null)">✕</button>
                    <button class="row-plus" title="新增顧客" onclick="event.stopPropagation(); openCustomerModal('new')">＋</button>
                </span>
            </div>

            <!-- 購物車商品 -->
            <div id="cartItems" class="cart-items"></div>

            <div class="cart-bottom">
                <div class="cart-row">
                    <span>小計</span>
                    <span id="subtotal">NT$0</span>
                </div>

                <!-- 整單折扣 -->
                <div class="cart-row clickable" id="discountRow" onclick="editDiscount()">
                    <span><span class="row-icon">🏷️</span><span id="discountLabel">新增整單折扣</span></span>
                    <span id="discountAmount" class="discount-amt"></span>
                </div>
                <div class="cart-row discount-edit" id="discountEdit" hidden>
                    <select id="discountType" onchange="updateDiscountPlaceholder()">
                        <option value="amount">減金額</option>
                        <option value="percent">打折</option>
                    </select>
                    <input type="number" id="discountValue" min="0" step="any" placeholder="例：100"
                           onkeydown="if (event.key === 'Enter') applyDiscount()">
                    <button class="small-btn" onclick="applyDiscount()">套用</button>
                    <button class="small-btn ghost" onclick="clearDiscount()">移除</button>
                </div>

                <div class="cart-row">
                    <span>銷售人員</span>
                    <select id="staff" class="staff-select">
                        <option value="">-- 選擇人員 --</option>
                    </select>
                </div>

                <!-- 付款方式（在付款視窗選好後顯示在這裡） -->
                <div class="cart-row clickable" id="paymentRow" onclick="openPayModal()">
                    <span><span class="row-icon">💳</span>付款方式</span>
                    <span id="paymentLabel" class="payment-label empty">請選擇 ›</span>
                </div>

                <button class="checkout-btn big" id="checkoutBtn" onclick="checkout()">結帳　<span id="totalAmount">NT$0</span></button>
                <div id="message"></div>
            </div>
        </div>
    </div>

    <!-- 付款視窗：點付款方式就完成結帳 -->
    <div id="payModal" class="modal-overlay" hidden onclick="if (event.target === this) closePayModal()">
        <div class="modal-card pay-card">
            <div class="modal-head">
                <h3>付款</h3>
                <button class="icon-btn" onclick="closePayModal()">✕</button>
            </div>
            <div class="pay-total" id="payTotal">NT$0</div>
            <div class="pay-row">
                <span>銷售人員</span>
                <select id="payStaff"></select>
            </div>
            <div class="pay-row">
                <span>統一編號</span>
                <input type="text" id="payTaxId" inputmode="numeric" maxlength="8" placeholder="選填，8 碼">
            </div>
            <div class="list-title">付款方式（選好後回到購物車按「結帳」）</div>
            <div class="pay-methods">
                <button class="pay-method" data-method="LINE Pay" onclick="selectPayment('LINE Pay')"><span class="pay-icon">💚</span>LINE Pay</button>
                <button class="pay-method" data-method="信用卡" onclick="selectPayment('信用卡')"><span class="pay-icon">💳</span>信用卡</button>
                <button class="pay-method" data-method="現金" onclick="selectPayment('現金')"><span class="pay-icon">💵</span>現金</button>
            </div>
            <div id="payMessage"></div>
        </div>
    </div>

    <!-- 顧客小視窗：搜尋 / 新增 / 編輯 / 歷史紀錄 -->
    <div id="customerModal" class="modal-overlay" hidden onclick="if (event.target === this) closeCustomerModal()">
        <div class="modal-card">
            <div class="modal-head">
                <button class="menu-back-dark" id="custBack" hidden onclick="showCustomerView('search')">‹ 返回</button>
                <h3 id="custTitle">顧客</h3>
                <button class="icon-btn" onclick="closeCustomerModal()">✕</button>
            </div>

            <!-- 搜尋舊客人 -->
            <div id="custSearchView">
                <input type="search" id="custQuery" placeholder="🔍 搜尋姓名或電話" oninput="searchCustomers()">
                <div id="custResults" class="cust-results"></div>
                <button class="checkout-btn" onclick="showCustomerView('form')">＋ 新增顧客</button>
            </div>

            <!-- 新增 / 編輯 -->
            <div id="custFormView" hidden>
                <label>姓名</label>
                <input type="text" id="custName" maxlength="30" placeholder="例：王小姐">
                <label>電話</label>
                <input type="tel" id="custPhone" maxlength="30" placeholder="例：0912-345-678">
                <label>地址</label>
                <input type="text" id="custAddress" maxlength="200" placeholder="例：高雄市…">
                <p class="hint-text">都可以不填，想填哪個就填哪個（至少填一個）。</p>
                <button class="checkout-btn" id="custSaveBtn" onclick="saveCustomer()">💾 儲存並選用</button>
                <div id="custMessage"></div>
            </div>

            <!-- 顧客資料 + 歷史紀錄 -->
            <div id="custDetailView" hidden>
                <div id="custInfo" class="cust-info"></div>
                <div class="cust-buttons">
                    <button class="checkout-btn" onclick="useCustomer(viewingCustomer)">✅ 選用這位顧客</button>
                    <button class="small-btn ghost" onclick="editCustomerForm(viewingCustomer)">✏️ 編輯資料</button>
                </div>
                <div class="list-title">歷史購買紀錄</div>
                <div id="custHistory"></div>
            </div>
        </div>
    </div>

    <!-- 未登記的裝置：鎖住整個前台，只能由店長登記 -->
    <div id="lockScreen" class="lock-screen" hidden>
        <div class="lock-card">
            <div style="font-size: 48px;">🔒</div>
            <h2>此裝置未授權</h2>
            <p>這台裝置還沒有登記為門市裝置，<br>不能使用收銀台、打卡和結帳紀錄。<br>請店長在下面登記這台裝置。</p>
            <div class="lock-form">
                <label>裝置名稱</label>
                <input type="text" id="regName" placeholder="例：高雄櫃台平板" maxlength="30">
                <label>門市</label>
                <select id="regStore">
                    <option value="高雄">高雄門市</option>
                    <option value="台中">台中門市</option>
                </select>
                <label>後台帳號</label>
                <input type="text" id="regUser" value="admin" autocomplete="username">
                <label>後台密碼</label>
                <input type="password" id="regPass" autocomplete="current-password">
                <button class="checkout-btn" id="regBtn" onclick="registerDevice()">📍 登記這台裝置</button>
                <div id="regMessage"></div>
            </div>
        </div>
    </div>

    <!-- 漢堡選單：人員打卡 / 結帳紀錄 -->
    <div id="menuOverlay" class="menu-overlay" hidden onclick="if (event.target === this) closeMenu()">
        <div class="menu-drawer">
            <div class="menu-head">
                <button id="menuBack" class="menu-back" onclick="showMenuTab('home')" hidden>‹ 返回</button>
                <h2 id="menuTitle">☰ 選單</h2>
                <button onclick="closeMenu()">✕</button>
            </div>
            <div class="menu-body">
                <!-- 目錄 -->
                <div id="menuHome">
                    <button class="menu-item" onclick="closeMenu()">
                        <span class="menu-icon">🛒</span>
                        <span><b>收銀台</b><small>回到結帳畫面</small></span>
                    </button>
                    <button class="menu-item" onclick="showMenuTab('punch')">
                        <span class="menu-icon">🕐</span>
                        <span><b>打卡</b><small>上班 / 下班打卡、備註</small></span>
                    </button>
                    <button class="menu-item" onclick="showMenuTab('orders')">
                        <span class="menu-icon">🧾</span>
                        <span><b>結帳紀錄</b><small>今日每一筆結帳</small></span>
                    </button>
                </div>

                <div class="menu-store" id="menuStoreRow" hidden>
                    <label>門市</label>
                    <select id="menuStore" onchange="changeMenuStore(this.value)">
                        <option value="高雄">高雄</option>
                        <option value="台中">台中</option>
                    </select>
                </div>

                <div id="punchPanel" hidden>
                    <div id="deviceStatus" class="device-status"></div>
                    <div class="list-title" style="margin-top: 0;">選擇人員</div>
                    <div id="punchStaffGrid" class="staff-grid"></div>
                    <input type="password" id="punchPin" class="punch-pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="🔒 打卡密碼（4～6 位數字）">
                    <textarea id="punchNote" class="punch-note" rows="2" maxlength="200" placeholder="備註（選填，例：外出送貨、補打卡、提早下班）"></textarea>
                    <div class="punch-buttons">
                        <button class="punch-btn in" onclick="punch('in')">🟢 上班打卡</button>
                        <button class="punch-btn out" onclick="punch('out')">🟠 下班打卡</button>
                    </div>
                    <div id="punchMessage"></div>
                    <div class="list-title">今日打卡紀錄</div>
                    <div id="punchList"></div>
                </div>

                <div id="ordersPanel" hidden>
                    <div class="day-summary">
                        <div><b id="dayOrders">0</b><span>今日結帳筆數</span></div>
                        <div><b id="dayQty">0</b><span>商品件數</span></div>
                        <div><b id="dayAmount">NT$0</b><span>今日營業額</span></div>
                    </div>
                    <div id="dayByPayment" class="pay-summary"></div>
                    <div class="list-title">今日結帳明細（最新的在最上面）</div>
                    <div id="orderList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = () => document.getElementById('apiUrl').value.trim().replace(/\/$/, '') || window.location.origin;

        // ---- 門市裝置：只有登記過的裝置能使用前台（收銀、打卡、結帳紀錄）----
        const DEVICE_KEY = 'pos_punch_device';
        const getDeviceToken = () => { try { return localStorage.getItem(DEVICE_KEY); } catch (e) { return null; } };
        let punchDevice = null;   // 這台裝置的登記資料 { name, store }

        // 所有呼叫後端的地方都帶上裝置代碼；裝置被停用時跳回鎖定畫面
        async function posFetch(path, options = {}) {
            const headers = { ...(options.headers || {}), 'X-Device-Token': getDeviceToken() || '' };
            const res = await fetch(`${API_URL()}${path}`, { ...options, headers });
            if (res.status === 403) {
                const data = await res.clone().json().catch(() => ({}));
                if (data.code === 'DEVICE_NOT_AUTHORIZED') showLockScreen();
            }
            return res;
        }

        function showLockScreen() {
            punchDevice = null;
            document.getElementById('regMessage').className = '';
            document.getElementById('regMessage').textContent = '';
            document.getElementById('lockScreen').hidden = false;
        }

        // 開啟頁面時先確認這台裝置，通過才載入商品和人員
        async function initDevice() {
            const token = getDeviceToken();
            punchDevice = null;
            if (token) {
                try {
                    const res = await fetch(`${API_URL()}/api/punch-device?token=${encodeURIComponent(token)}`);
                    if (res.ok) punchDevice = (await res.json()).data;
                } catch (e) { /* 網路錯誤 */ }
            }
            if (!punchDevice) return showLockScreen();

            document.getElementById('lockScreen').hidden = true;
            // 門市固定為裝置登記的門市
            ['store', 'menuStore'].forEach(id => {
                const select = document.getElementById(id);
                select.value = punchDevice.store;
                select.disabled = true;
            });
            document.getElementById('cartStoreLabel').textContent = `📍 ${punchDevice.store}門市`;
            loadProducts();
            loadStaff();
        }

        // 店長在鎖定畫面輸入後台帳密，登記這台裝置
        async function registerDevice() {
            const msg = document.getElementById('regMessage');
            const name = document.getElementById('regName').value.trim();
            const store = document.getElementById('regStore').value;
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const fail = (text) => { msg.className = 'message error'; msg.textContent = text; };
            if (!name) return fail('請填裝置名稱，例如：高雄櫃台平板');
            if (!user || !pass) return fail('請輸入後台帳號和密碼');

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            try {
                const basic = btoa(String.fromCharCode(...new TextEncoder().encode(`${user}:${pass}`)));
                const res = await fetch(`${API_URL()}/api/admin/devices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Basic ${basic}`, 'X-No-Auth-Prompt': '1' },
                    body: JSON.stringify({ name, store })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || res.status);
                try { localStorage.setItem(DEVICE_KEY, data.data.token); } catch (e) {
                    throw new Error('這個瀏覽器無法儲存設定（可能是無痕模式），請用一般模式開啟');
                }
                document.getElementById('regPass').value = '';
                msg.className = 'message success';
                msg.textContent = `✓ 已登記為 ${store}門市 裝置`;
                await initDevice();
            } catch (error) {
                fail('登記失敗：' + error.message);
            } finally {
                document.getElementById('regPass').value = '';
                btn.disabled = false;
            }
        }

        let cart = {};
        let currentSeries = null;

        // 商品從後台讀取（在後台「庫存管理」新增、修改、下架）
        let seriesData = [];
        let currentCategory = '';

        async function loadProducts() {
            const seriesView = document.getElementById('seriesView');
            try {
                const res = await posFetch(`/api/inventory`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || res.status);

                // 依大分類 + 系列分組，只顯示上架中的商品
                seriesData = [];
                const groups = {};
                data.data.filter(p => p.active).forEach(p => {
                    const key = `${p.category}|${p.series}`;
                    if (!groups[key]) {
                        groups[key] = { category: p.category, name: p.series, items: [] };
                        seriesData.push(groups[key]);
                    }
                    groups[key].items.push({ id: p.id, name: p.name, price: p.price, gaoxiong: p.gaoxiong, taizhong: p.taizhong });
                });
                renderSeriesView();

                // 品項視窗開著的話，換成最新庫存
                if (currentSeries) {
                    currentSeries = seriesData.find(s => s.category === currentSeries.category && s.name === currentSeries.name) || null;
                    if (currentSeries) renderItemsView(); else closeItemModal();
                }
            } catch (error) {
                seriesView.innerHTML = `<div class="message error">商品載入失敗：${error.message}，請重新整理頁面</div>`;
            }
        }

        function selectCategory(category) {
            currentCategory = category;
            renderSeriesView();
        }

        function renderSeriesView() {
            const seriesView = document.getElementById('seriesView');
            const tabs = document.getElementById('categoryTabs');
            seriesView.innerHTML = '';
            tabs.innerHTML = '';
            if (!seriesData.length) {
                seriesView.innerHTML = '<div class="message">目前沒有上架的商品，請到後台新增</div>';
                return;
            }

            // 大分類按鈕（預設選第一個；分類被刪掉時也回到第一個）
            const categories = [...new Set(seriesData.map(s => s.category))];
            if (!categories.includes(currentCategory)) currentCategory = categories[0];
            categories.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (c === currentCategory ? ' active' : '');
                btn.textContent = c;
                btn.onclick = () => selectCategory(c);
                tabs.appendChild(btn);
            });

            seriesData.filter(s => s.category === currentCategory).forEach(series => {
                const card = document.createElement('div');
                card.className = 'series-card';
                card.innerHTML = `
                    <h3>${series.name}</h3>
                    <p>${series.items.length} 個品項</p>
                `;
                card.onclick = () => selectSeries(series);
                seriesView.appendChild(card);
            });
        }

        function selectSeries(series) {
            currentSeries = series;
            document.getElementById('modalTitle').textContent = series.name;
            renderItemsView();
            document.getElementById('itemModal').style.display = 'block';
            loadProducts(); // 抓最新庫存（其他門市或裝置可能剛賣出）
        }

        function renderItemsView() {
            const itemsGrid = document.getElementById('itemsGrid');
            itemsGrid.innerHTML = '';
            currentSeries.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                if (cart[item.id]) card.classList.add('selected');
                // 顯示目前選擇門市的庫存
                const store = document.getElementById('store').value;
                const stock = store === '高雄' ? item.gaoxiong : item.taizhong;
                const inCart = cart[item.id] ? cart[item.id].qty : 0;
                const stockClass = stock - inCart <= 0 ? 'out' : stock - inCart <= 5 ? 'low' : '';
                card.innerHTML = `
                    <div class="product-name">${item.name}</div>
                    <div class="product-price">NT$${item.price}</div>
                    <div class="product-stock ${stockClass}">
                        ${store}庫存：${stock}${inCart ? `<br>結帳後剩 ${stock - inCart}` : ''}
                    </div>
                `;
                card.onclick = () => {
                    addToCart(item);
                    closeItemModal();
                };
                itemsGrid.appendChild(card);
            });
        }

        function closeItemModal() {
            document.getElementById('itemModal').style.display = 'none';
            currentSeries = null;
        }

        function addToCart(product) {
            if (!cart[product.id]) {
                cart[product.id] = { ...product, qty: 0 };
            }
            cart[product.id].qty += 1;
            renderCart();
            if (currentSeries) renderItemsView();
        }

        function removeFromCart(productId) {
            delete cart[productId];
            renderCart();
            if (currentSeries) renderItemsView();
        }

        function updateQty(productId, newQty) {
            if (newQty <= 0) {
                removeFromCart(productId);
            } else {
                cart[productId].qty = newQty;
                renderCart();
            }
        }

        // ---- 顧客（建檔、搜尋舊客人、歷史紀錄）----
        let customer = null;          // 這筆訂單選用的顧客 { id, name, phone, address }
        let viewingCustomer = null;   // 小視窗正在看 / 編輯的顧客
        let editingCustomerId = null; // 編輯中（null = 新增）
        const customerText = (c) => c.name || c.phone || c.address || `顧客 #${c.id}`;

        function setCustomer(c) {
            customer = c;
            const label = document.getElementById('customerLabel');
            label.innerHTML = c
                ? `${esc(customerText(c))}${c.name && c.phone ? `<span class="cust-phone">${esc(c.phone)}</span>` : ''}`
                : '搜尋 / 新增顧客';
            document.getElementById('customerClear').hidden = !c;
        }

        // mode：'new' 直接開新增表單；沒給就看有沒有選顧客（有 → 顯示資料，沒有 → 搜尋）
        function openCustomerModal(mode) {
            document.getElementById('customerModal').hidden = false;
            if (mode === 'new') return showCustomerView('form');
            if (customer) return showCustomerDetail(customer.id);
            showCustomerView('search');
        }

        function closeCustomerModal() {
            document.getElementById('customerModal').hidden = true;
        }

        function showCustomerView(view) {
            document.getElementById('custSearchView').hidden = view !== 'search';
            document.getElementById('custFormView').hidden = view !== 'form';
            document.getElementById('custDetailView').hidden = view !== 'detail';
            document.getElementById('custBack').hidden = view === 'search';
            document.getElementById('custMessage').textContent = '';
            document.getElementById('custMessage').className = '';
            if (view === 'search') {
                document.getElementById('custTitle').textContent = '👤 選擇顧客';
                searchCustomers();
                document.getElementById('custQuery').focus();
            }
            if (view === 'form' && !editingCustomerId) {
                document.getElementById('custTitle').textContent = '＋ 新增顧客';
                document.getElementById('custSaveBtn').textContent = '💾 儲存並選用';
                ['custName', 'custPhone', 'custAddress'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('custName').focus();
            }
            if (view !== 'form') editingCustomerId = null;
        }

        let searchTimer = null;
        function searchCustomers() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const box = document.getElementById('custResults');
                const q = document.getElementById('custQuery').value.trim();
                try {
                    const list = await getJson(`/api/customers?q=${encodeURIComponent(q)}`);
                    box.innerHTML = list.length ? list.map(c => `
                        <div class="cust-item" onclick="showCustomerDetail(${c.id})">
                            <div><b>${esc(c.name || '（未填姓名）')}</b>
                                <small>${esc(c.phone || '')}${c.phone && c.address ? '　' : ''}${esc(c.address || '')}</small></div>
                            <small>${c.orders + (c.legacy_orders || 0) ? `買過 ${c.orders + (c.legacy_orders || 0)} 次` : '尚無紀錄'}</small>
                        </div>`).join('')
                        : `<div class="empty">${q ? '找不到這位顧客，可以按下面「新增顧客」' : '還沒有建檔的顧客'}</div>`;
                } catch (error) {
                    box.innerHTML = `<div class="message error">搜尋失敗：${esc(error.message)}</div>`;
                }
            }, 250);
        }

        async function showCustomerDetail(id) {
            showCustomerView('detail');
            document.getElementById('custTitle').textContent = '👤 顧客資料';
            const info = document.getElementById('custInfo');
            const history = document.getElementById('custHistory');
            info.textContent = '載入中…';
            history.innerHTML = '';
            try {
                const { customer: c, sales } = await getJson(`/api/customers/${id}/history`);
                viewingCustomer = c;
                info.innerHTML = `
                    <div>👤 ${esc(c.name || '（未填姓名）')}</div>
                    <div>📞 ${esc(c.phone || '（未填電話）')}</div>
                    <div>🏠 ${esc(c.address || '（未填地址）')}</div>
                    ${c.birthday ? `<div>🎂 ${esc(c.birthday)}</div>` : ''}
                    ${c.note ? `<div>📝 ${esc(c.note)}</div>` : ''}`;

                // 同單號合成一張單
                const orders = [];
                sales.forEach(r => {
                    let o = r.order_no && orders.find(o => o.no === r.order_no);
                    if (!o) orders.push(o = { no: r.order_no, time: r.timestamp, store: r.store, staff: r.staff, lines: [], total: 0, discount: 0 });
                    o.lines.push(r);
                    o.total += r.total;
                    o.discount += r.discount || 0;
                });
                // 累計含舊系統匯入的紀錄（舊系統沒有明細）
                const legacyOrders = c.legacy_orders || 0, legacySpent = c.legacy_spent || 0;
                const spent = orders.reduce((s, o) => s + o.total, 0) + legacySpent;
                const legacyNote = legacyOrders || legacySpent
                    ? `<p class="hint-text" style="margin: 0 0 10px;">🗂️ 含舊系統 ${legacyOrders} 筆、NT$${legacySpent.toLocaleString()}（舊系統沒有明細）</p>` : '';
                history.innerHTML = orders.length || legacyOrders
                    ? `<div class="day-summary" style="margin-bottom: 6px;">
                           <div><b>${orders.length + legacyOrders}</b><span>購買次數</span></div>
                           <div><b>NT$${spent.toLocaleString()}</b><span>累計消費</span></div>
                       </div>` + legacyNote + orders.map(o => `
                        <div class="order-card">
                            <div class="order-head">
                                <span>📅 ${new Date(o.time).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false })}</span>
                                <span>${esc(o.store)}・${esc(o.staff)}</span>
                            </div>
                            ${o.lines.map(l => `
                                <div class="order-line"><span>${esc(l.product_name)} × ${l.quantity}</span><span>NT$${(l.price * l.quantity).toLocaleString()}</span></div>`).join('')}
                            ${o.discount ? `<div class="order-line" style="color:#e03131"><span>整單折扣</span><span>-NT$${o.discount.toLocaleString()}</span></div>` : ''}
                            <div class="order-total"><span>合計</span><span>NT$${o.total.toLocaleString()}</span></div>
                        </div>`).join('')
                    : '<div class="empty">還沒有購買紀錄</div>';
            } catch (error) {
                info.innerHTML = `<span style="color:#e03131">載入失敗：${esc(error.message)}</span>`;
            }
        }

        function useCustomer(c) {
            if (!c) return;
            setCustomer(c);
            closeCustomerModal();
        }

        function editCustomerForm(c) {
            if (!c) return;
            editingCustomerId = c.id;
            showCustomerView('form');
            document.getElementById('custTitle').textContent = '✏️ 編輯顧客';
            document.getElementById('custSaveBtn').textContent = '💾 儲存修改';
            document.getElementById('custName').value = c.name || '';
            document.getElementById('custPhone').value = c.phone || '';
            document.getElementById('custAddress').value = c.address || '';
        }

        async function saveCustomer() {
            const msg = document.getElementById('custMessage');
            const body = {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                address: document.getElementById('custAddress').value.trim()
            };
            if (!body.name && !body.phone && !body.address) {
                msg.className = 'message error';
                msg.textContent = '請至少填一個欄位';
                return;
            }
            const editing = editingCustomerId;
            try {
                const res = await posFetch(editing ? '/api/customers/update' : '/api/customers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(editing ? { id: editing, ...body } : body)
                });
                const data = await res.json();
                if (res.status === 409 && data.data) {
                    // 電話已經建檔 → 直接帶出那位顧客
                    msg.className = 'message error';
                    msg.textContent = data.message + '，已幫你帶出這位顧客';
                    setTimeout(() => showCustomerDetail(data.data.id), 900);
                    return;
                }
                if (!res.ok) throw new Error(data.message);
                if (editing) {
                    if (customer && customer.id === editing) setCustomer(data.data);
                    editingCustomerId = null;
                    showCustomerDetail(editing);
                } else {
                    useCustomer(data.data); // 新增完直接選用
                }
            } catch (error) {
                msg.className = 'message error';
                msg.textContent = '儲存失敗：' + error.message;
            }
        }

        // ---- 整單折扣：減金額，或打折（9 折填 9、85 折填 85）----
        let discount = null;   // { type: 'amount' | 'percent', value }

        function editDiscount() {
            document.getElementById('discountEdit').hidden = false;
            updateDiscountPlaceholder();
            document.getElementById('discountValue').focus();
        }

        function updateDiscountPlaceholder() {
            const type = document.getElementById('discountType').value;
            document.getElementById('discountValue').placeholder = type === 'amount' ? '例：100' : '9 折填 9，85 折填 85';
        }

        // 打折數字換成付款比例：9 → 0.9、8.5 → 0.85、85 → 0.85
        function discountRate(v) {
            return v < 10 ? v / 10 : v / 100;
        }

        function applyDiscount() {
            const type = document.getElementById('discountType').value;
            const value = Number(document.getElementById('discountValue').value);
            if (!value || value <= 0) return showMessage('請輸入折扣', 'error');
            if (type === 'amount' && !Number.isInteger(value)) return showMessage('折扣金額請填整數', 'error');
            if (type === 'percent' && !(discountRate(value) > 0 && discountRate(value) < 1)) return showMessage('打折請填 1～99，例如 9 折填 9', 'error');
            discount = { type, value };
            document.getElementById('discountEdit').hidden = true;
            renderCart();
        }

        function clearDiscount() {
            discount = null;
            document.getElementById('discountValue').value = '';
            document.getElementById('discountEdit').hidden = true;
            renderCart();
        }

        function discountOf(subtotal) {
            if (!discount || subtotal <= 0) return 0;
            const d = discount.type === 'amount' ? discount.value : Math.round(subtotal * (1 - discountRate(discount.value)));
            return Math.min(Math.max(d, 0), subtotal);
        }

        function clearCart() {
            if (!Object.keys(cart).length) return;
            if (!confirm('確定要清空購物車？')) return;
            cart = {};
            renderCart();
            if (currentSeries) renderItemsView();
        }

        function renderCart() {
            const cartDiv = document.getElementById('cartItems');
            cartDiv.innerHTML = '';

            let totalQty = 0;
            let totalAmount = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalAmount += item.qty * item.price;

                cartDiv.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-qty">NT$${item.price} × ${item.qty}</div>
                        </div>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <input type="number" class="qty-input" value="${item.qty}" min="1" onchange="updateQty(${item.id}, parseInt(this.value))">
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">刪</button>
                        </div>
                        <div class="cart-item-total">NT$${(item.qty * item.price).toLocaleString()}</div>
                    </div>
                `;
            });

            if (!totalQty) cartDiv.innerHTML = '<div class="cart-empty">購物車是空的<br>從左邊點選商品加入</div>';

            const off = discountOf(totalAmount);
            document.getElementById('cartCount').textContent = `(${totalQty}件)`;
            document.getElementById('subtotal').textContent = `NT$${totalAmount.toLocaleString()}`;
            document.getElementById('discountLabel').textContent = !discount ? '新增整單折扣'
                : discount.type === 'amount' ? `整單折扣：減 NT$${discount.value.toLocaleString()}` : `整單折扣：${discount.value} 折`;
            document.getElementById('discountAmount').textContent = off ? `-NT$${off.toLocaleString()}` : '';
            document.getElementById('totalAmount').textContent = `NT$${(totalAmount - off).toLocaleString()}`;
        }

        // ---- 付款：先在付款視窗選方式 → 回到購物車按「結帳」完成 ----
        let payment = null;   // '現金' | 'LINE Pay' | '信用卡'
        let taxId = '';
        const PAY_ICONS = { '現金': '💵', 'LINE Pay': '💚', '信用卡': '💳' };

        function renderPayment() {
            const label = document.getElementById('paymentLabel');
            label.className = 'payment-label' + (payment ? '' : ' empty');
            label.innerHTML = payment
                ? `${PAY_ICONS[payment]} ${esc(payment)}${taxId ? `<small>統編 ${esc(taxId)}</small>` : ''} ✎`
                : '請選擇 ›';
        }

        // 按「結帳」：還沒選付款方式 → 先跳付款視窗；選好了 → 完成結帳
        function checkout() {
            if (Object.keys(cart).length === 0) {
                showMessage('購物車是空的', 'error');
                return;
            }
            if (!payment || !document.getElementById('staff').value) return openPayModal();
            completeCheckout();
        }

        function openPayModal() {
            const subtotal = Object.values(cart).reduce((s, i) => s + i.qty * i.price, 0);
            document.getElementById('payTotal').textContent = `NT$${(subtotal - discountOf(subtotal)).toLocaleString()}`;
            const payStaff = document.getElementById('payStaff');
            payStaff.innerHTML = document.getElementById('staff').innerHTML;
            payStaff.value = document.getElementById('staff').value;
            document.getElementById('payTaxId').value = taxId;
            document.getElementById('payMessage').className = '';
            document.getElementById('payMessage').textContent = '';
            document.querySelectorAll('.pay-method').forEach(b => {
                b.disabled = false;
                b.classList.toggle('selected', b.dataset.method === payment);
            });
            document.getElementById('payModal').hidden = false;
        }

        function closePayModal() {
            document.getElementById('payModal').hidden = true;
        }

        // 點付款方式 → 記下來，回到購物車
        function selectPayment(method) {
            const staff = document.getElementById('payStaff').value;
            const tax = document.getElementById('payTaxId').value.trim();
            const msg = document.getElementById('payMessage');
            if (!staff) { msg.className = 'message error'; msg.textContent = '請選擇銷售人員'; return; }
            if (tax && !/^\d{8}$/.test(tax)) { msg.className = 'message error'; msg.textContent = '統一編號是 8 位數字'; return; }
            document.getElementById('staff').value = staff;
            payment = method;
            taxId = tax;
            renderPayment();
            closePayModal();
        }

        function clearPayment() {
            payment = null;
            taxId = '';
            renderPayment();
        }

        // 完成結帳（付款方式已選好）
        async function completeCheckout() {
            const staff = document.getElementById('staff').value;
            const store = document.getElementById('store').value;
            const paymentMethod = payment;
            const fail = (text) => showMessage(text, 'error');

            if (!staff) return fail('請選擇銷售人員');
            if (!paymentMethod) return openPayModal();

            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;

            // 同一次結帳的品項共用單號，結帳紀錄會合成一張單
            const orderNo = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

            // 整單折扣依金額比例分到每個品項，營業額才會正確；
            // 先按比例分（無條件捨去），剩下的零頭再補給還有空間的品項，每項折扣不超過該項金額
            const lines = Object.entries(cart).map(([productId, item]) => ({ productId, item, gross: item.qty * item.price }));
            const subtotal = lines.reduce((s, l) => s + l.gross, 0);
            const off = discountOf(subtotal);
            let remaining = off;
            lines.forEach(l => {
                l.discount = Math.min(l.gross, Math.floor(off * l.gross / subtotal));
                remaining -= l.discount;
            });
            for (const l of lines) {
                const add = Math.min(remaining, l.gross - l.discount);
                l.discount += add;
                remaining -= add;
            }

            try {
                for (const { productId, item, discount: lineDiscount } of lines) {
                    const res = await posFetch(`/api/sales/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            product_id: parseInt(productId),
                            quantity: item.qty,
                            store: store,
                            staff: staff,
                            customer_name: customer ? customerText(customer) : '',
                            customer_id: customer ? customer.id : null,
                            order_no: orderNo,
                            discount: lineDiscount,
                            payment_method: paymentMethod,
                            tax_id: taxId
                        })
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        fail('結帳失敗: ' + error.message);
                        btn.disabled = false;
                        return;
                    }
                }

                const paid = document.getElementById('totalAmount').textContent;
                showMessage(`✓ 結帳成功！${paymentMethod} 收 ${paid}`, 'success');
                cart = {};
                setCustomer(null);
                clearDiscount();
                clearPayment();
                renderCart();
                loadProducts(); // 更新庫存數字
                btn.disabled = false;
            } catch (error) {
                fail('結帳失敗: ' + error.message);
                btn.disabled = false;
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = 'message ' + type;
            setTimeout(() => { msgDiv.textContent = ''; msgDiv.className = ''; }, 3000);
        }

        function toggleCart() {
            const cartPanel = document.getElementById('cartPanel');
            cartPanel.classList.toggle('show');
        }

        // ============ 漢堡選單：人員打卡 / 結帳紀錄 ============
        let menuTab = 'home';
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const timeOf = (t) => new Date(t).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });

        async function getJson(path) {
            const res = await posFetch(`${path}`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || res.status);
            return data.data;
        }

        function openMenu() {
            // 門市預設跟結帳區一樣；打卡人員每次都要自己點選
            document.getElementById('menuStore').value = document.getElementById('store').value;
            selectPunchStaff('');
            document.getElementById('menuOverlay').hidden = false;
            showMenuTab('home'); // 每次打開都先顯示目錄
        }

        function closeMenu() {
            document.getElementById('menuOverlay').hidden = true;
        }

        function showMenuTab(tab) {
            menuTab = tab;
            const titles = { home: '☰ 選單', punch: '🕐 打卡', orders: '🧾 結帳紀錄' };
            document.getElementById('menuTitle').textContent = titles[tab];
            document.getElementById('menuBack').hidden = tab === 'home';
            document.getElementById('menuHome').hidden = tab !== 'home';
            document.getElementById('menuStoreRow').hidden = tab === 'home';
            document.getElementById('punchPanel').hidden = tab !== 'punch';
            document.getElementById('ordersPanel').hidden = tab !== 'orders';
            document.getElementById('punchMessage').className = '';
            document.getElementById('punchMessage').textContent = '';
            if (tab === 'punch') checkDevice().then(loadPunches);
            else if (tab === 'orders') loadOrders();
        }

        // 打卡畫面上方顯示這台裝置
        async function checkDevice() {
            const box = document.getElementById('deviceStatus');
            box.className = 'device-status ' + (punchDevice ? 'ok' : 'bad');
            box.innerHTML = punchDevice
                ? `📍 ${esc(punchDevice.store)}門市裝置（${esc(punchDevice.name)}）`
                : '⚠️ 這台裝置未授權，不能打卡。';
            document.querySelectorAll('.punch-btn').forEach(b => b.disabled = !punchDevice);
        }

        // 員工名單從後台讀取（後台「打卡設定」管理）
        async function loadStaff() {
            try {
                const names = await getJson('/api/staff');
                const options = '<option value="">-- 選擇人員 --</option>' +
                    names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
                const select = document.getElementById('staff');
                const current = select.value;
                select.innerHTML = options;
                select.value = current;
            } catch (e) { /* 讀不到就保留原本的名單 */ }
        }

        function changeMenuStore(store) {
            document.getElementById('store').value = store; // 結帳區門市一起切換
            showMenuTab(menuTab);
        }

        // 打卡人員用按鈕選（名單同結帳區的銷售人員）
        let punchStaffName = '';

        function selectPunchStaff(name) {
            punchStaffName = name;
            const names = [...document.getElementById('staff').options].map(o => o.value).filter(Boolean);
            const grid = document.getElementById('punchStaffGrid');
            grid.innerHTML = '';
            names.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'staff-tile' + (n === name ? ' active' : '');
                btn.textContent = n;
                btn.onclick = () => selectPunchStaff(n === punchStaffName ? '' : n);
                grid.appendChild(btn);
            });
        }

        async function punch(type) {
            const staff = punchStaffName;
            const pinInput = document.getElementById('punchPin');
            const msg = document.getElementById('punchMessage');
            const fail = (text) => { msg.className = 'message error'; msg.textContent = text; };
            if (!punchDevice) return fail('這台裝置不能打卡');
            if (!staff) return fail('請先選擇人員');
            if (!/^\d{4,6}$/.test(pinInput.value)) return fail('請輸入 4～6 位數字的打卡密碼');

            document.querySelectorAll('.punch-btn').forEach(b => b.disabled = true);
            try {
                const res = await posFetch(`/api/attendance/punch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        staff, type,
                        pin: pinInput.value,
                        device_token: getDeviceToken(),
                        note: document.getElementById('punchNote').value.trim()
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);
                msg.className = 'message success';
                msg.textContent = `✓ ${staff} ${type === 'in' ? '上班' : '下班'}打卡成功（${timeOf(data.data.created_at)}）`;
                document.getElementById('punchNote').value = '';
                selectPunchStaff(''); // 下一位要重新選自己
                loadPunches();
            } catch (error) {
                msg.className = 'message error';
                msg.textContent = '打卡失敗：' + error.message;
            } finally {
                pinInput.value = ''; // 密碼不留在畫面上
                document.querySelectorAll('.punch-btn').forEach(b => b.disabled = !punchDevice);
            }
        }

        async function loadPunches() {
            const list = document.getElementById('punchList');
            try {
                const rows = await getJson(`/api/attendance/today?store=${encodeURIComponent(document.getElementById('menuStore').value)}`);
                list.innerHTML = rows.length ? rows.map(r => `
                    <div class="list-row">
                        <span>${timeOf(r.created_at)}　${esc(r.staff)}${r.note ? `<div class="punch-note-text">📝 ${esc(r.note)}</div>` : ''}</span>
                        <span class="tag ${r.type}">${r.type === 'in' ? '上班' : '下班'}</span>
                    </div>`).join('') : '<div class="empty">今天還沒有人打卡</div>';
            } catch (error) {
                list.innerHTML = `<div class="message error">載入失敗：${esc(error.message)}</div>`;
            }
        }

        async function loadOrders() {
            const list = document.getElementById('orderList');
            try {
                const rows = await getJson(`/api/pos/sales/today?store=${encodeURIComponent(document.getElementById('menuStore').value)}`);

                // 同單號的品項合成一張單（舊紀錄沒有單號就各自一張）
                const orders = [];
                rows.forEach(r => {
                    let o = r.order_no && orders.find(o => o.no === r.order_no);
                    if (!o) orders.push(o = { no: r.order_no, time: r.timestamp, staff: r.staff, customer: r.customer_name, payment: r.payment_method, taxId: r.tax_id, lines: [], total: 0 });
                    o.lines.push(r);
                    o.total += r.total;
                    o.discount = (o.discount || 0) + (r.discount || 0);
                });

                document.getElementById('dayOrders').textContent = orders.length;
                document.getElementById('dayQty').textContent = rows.reduce((s, r) => s + r.quantity, 0);
                document.getElementById('dayAmount').textContent = 'NT$' + rows.reduce((s, r) => s + r.total, 0).toLocaleString();

                // 依付款方式加總（關店對帳用）
                const byPay = {};
                rows.forEach(r => { const k = r.payment_method || '未記錄'; byPay[k] = (byPay[k] || 0) + r.total; });
                const payIcon = { '現金': '💵', 'LINE Pay': '💚', '信用卡': '💳' };
                document.getElementById('dayByPayment').innerHTML = Object.entries(byPay).map(([k, v]) =>
                    `<div><span>${payIcon[k] || '❔'} ${esc(k)}</span><b>NT$${v.toLocaleString()}</b></div>`).join('');

                list.innerHTML = orders.length ? orders.map(o => `
                    <div class="order-card">
                        <div class="order-head">
                            <span>🕐 ${timeOf(o.time)}　👤 ${esc(o.staff)}${o.payment ? `　${esc(o.payment)}` : ''}</span>
                            <span>${esc(o.customer)}${o.taxId ? `　統編 ${esc(o.taxId)}` : ''}</span>
                        </div>
                        ${o.lines.map(l => `
                            <div class="order-line">
                                <span>${esc(l.product_name)} × ${l.quantity}</span>
                                <span>NT$${(l.price * l.quantity).toLocaleString()}</span>
                            </div>`).join('')}
                        ${o.discount ? `<div class="order-line" style="color:#e03131"><span>整單折扣</span><span>-NT$${o.discount.toLocaleString()}</span></div>` : ''}
                        <div class="order-total"><span>合計</span><span>NT$${o.total.toLocaleString()}</span></div>
                    </div>`).join('') : '<div class="empty">今天還沒有結帳紀錄</div>';
            } catch (error) {
                list.innerHTML = `<div class="message error">載入失敗：${esc(error.message)}</div>`;
            }
        }

        // 初始化：先確認裝置，通過後才載入商品、員工名單
        initDevice();
        renderCart();
    </script>
</body>
</html>
